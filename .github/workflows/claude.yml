name: Claude

# Two ways in:
# - Every PR gets a review against CONTRIBUTING.md.
# - Mention @claude in an issue, PR, or review comment to ask for anything.
#
# Needs a CLAUDE_CODE_OAUTH_TOKEN secret (run /install-github-app in Claude
# Code, or `claude setup-token`). Without it, both jobs skip instead of fail.

on:
  pull_request:
    types: [opened, synchronize, ready_for_review, reopened]
  issue_comment:
    types: [created]
  pull_request_review_comment:
    types: [created]
  issues:
    types: [opened, assigned]

jobs:
  review:
    name: Review PR
    if: github.event_name == 'pull_request' && !github.event.pull_request.draft && github.event.pull_request.user.login != 'dependabot[bot]'
    runs-on: ubuntu-latest
    concurrency:
      group: claude-review-${{ github.event.pull_request.number }}
      cancel-in-progress: true
    permissions:
      contents: read
      pull-requests: write
      issues: read
      id-token: write
    env:
      CLAUDE_CODE_OAUTH_TOKEN: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
    steps:
      - name: Skip without a token
        if: env.CLAUDE_CODE_OAUTH_TOKEN == ''
        run: echo "::notice::CLAUDE_CODE_OAUTH_TOKEN is not set; skipping Claude review."

      - uses: actions/checkout@v4
        if: env.CLAUDE_CODE_OAUTH_TOKEN != ''
        with:
          fetch-depth: 1

      - uses: anthropics/claude-code-action@v1
        if: env.CLAUDE_CODE_OAUTH_TOKEN != ''
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          prompt: |
            REPO: ${{ github.repository }}
            PR NUMBER: ${{ github.event.pull_request.number }}

            Review this pull request. This repo is personal dotfiles that are
            symlinked into $HOME on real machines, so a mistake breaks a live
            shell, editor, or terminal. Read CONTRIBUTING.md and CLAUDE.md first
            and hold the PR to them.

            Look hardest at:
            - install.sh: is it still idempotent, safe to pipe from curl, and
              free of anything that deletes user files? Does --dry-run still
              change nothing?
            - zsh: anything that prints or prompts above the Powerlevel10k
              instant prompt, slow startup, or machine-specific paths
            - Secrets, tokens, history files, or personal paths being committed
            - Docs (README.md, CLAUDE.md, CONTRIBUTING.md) that no longer match
              the change

            Report only real problems, most severe first, each with the file and
            line. Skip style nits that CI already enforces. If it looks good,
            say so in one line. Post the review with `gh pr comment`.
          claude_args: |
            --allowedTools "Bash(gh pr comment:*),Bash(gh pr diff:*),Bash(gh pr view:*),Bash(gh issue view:*)"

  respond:
    name: Respond to @claude
    if: |
      (github.event_name == 'issue_comment' && contains(github.event.comment.body, '@claude')) ||
      (github.event_name == 'pull_request_review_comment' && contains(github.event.comment.body, '@claude')) ||
      (github.event_name == 'issues' && (contains(github.event.issue.body, '@claude') || contains(github.event.issue.title, '@claude')))
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
      issues: write
      id-token: write
      actions: read
    env:
      CLAUDE_CODE_OAUTH_TOKEN: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
    steps:
      - name: Skip without a token
        if: env.CLAUDE_CODE_OAUTH_TOKEN == ''
        run: echo "::notice::CLAUDE_CODE_OAUTH_TOKEN is not set; skipping."

      - uses: actions/checkout@v4
        if: env.CLAUDE_CODE_OAUTH_TOKEN != ''
        with:
          fetch-depth: 1

      - uses: anthropics/claude-code-action@v1
        if: env.CLAUDE_CODE_OAUTH_TOKEN != ''
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          additional_permissions: |
            actions: read
