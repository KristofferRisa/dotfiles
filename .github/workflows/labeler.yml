name: Label PR

on:
  pull_request_target:
    types: [opened, synchronize, reopened]

# pull_request_target runs with a write token, so this job must never check
# out or run code from the PR. The labeler only reads the list of changed files.
permissions:
  contents: read
  pull-requests: write

jobs:
  label:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/labeler@v5
        with:
          sync-labels: true
