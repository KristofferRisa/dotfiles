name: Label PR

on:
  pull_request_target:
    types: [opened, synchronize, reopened]

# pull_request_target runs with a write token, so this job must never check
# out or run code from the PR. The labeler only reads the list of changed files.
permissions:
  contents: read
  pull-requests: write

# No paths-ignore: docs-only PRs are what the docs label is for.
concurrency:
  group: labeler-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  label:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/labeler@v7
        with:
          sync-labels: true
